name: CI

on:
  push:
    branches: ['*']

jobs:
  test:
    name: Typecheck, lint, and test
    type: custom
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bunx jest --ci --silent
